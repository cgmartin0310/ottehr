name: Deploy QA Back Telemed EHR

on:
  workflow_dispatch:
    inputs:
      on:
        workflow_dispatch:
          inputs:
            environment:
              description: 'Environment name'
              required: true
              type: choice
              default: 'testing'
              options:
                - testing
            branch:
              description: 'Branch to deploy'
              required: true
              default: 'main'

jobs:
  deploy:
    env:
      ZAMBDAS_LOCATION: packages/telemed-ehr/zambdas

    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    strategy:
      matrix:
        node-version: [18.18.0]

    steps:
      - name: Checkout code
          uses: actions/checkout@v2
          with:
            ref: ${{ github.event.inputs.branch }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Create the .env directory.
          run: mkdir -p ${{ env.ZAMBDAS_LOCATION }}/.env/

      - name: Create /.env/${{ github.event.inputs.environment }}.json file
          run: |
#            echo YOUR_ENV_VARIABLE_1=${{ secrets.QA_YOUR_ENV_VARIABLE_1 }} >> testing.json
            echo AUTH0_ENDPOINT=https://auth.zapehr.com/oauth/token >> ${{ github.event.inputs.environment }}.json
            echo URGENT_CARE_AUTH0_CLIENT=nBn0SKpQVXlxvjZACmzMNbOjEctO8vlQ >> ${{ github.event.inputs.environment }}.json
            echo URGENT_CARE_AUTH0_SECRET=PALOlpzDu4gTXkAWVJJSjTodvHSeZ2BlJ8v95WPuOqT9UBWej7cQ26jZShc2MVJg >> ${{ github.event.inputs.environment }}.json
            echo AUTH0_AUDIENCE=https://api.zapehr.com >> ${{ github.event.inputs.environment }}.json
            echo FHIR_API=https://fhir-api.zapehr.com/r4 >> ${{ github.event.inputs.environment }}.json
            echo PROJECT_API=https://project-api.zapehr.com/v1 >> ${{ github.event.inputs.environment }}.json
            echo ENVIRONMENT=qa >> ${{ github.event.inputs.environment }}.json
            echo ORGANIZATION_ID=5b6d4bb1-c373-4bb2-90b1-75ae1cdd1ea0 >> ${{ github.event.inputs.environment }}.json
            echo PROJECT_ID=6c359bd1-c5f3-4ff1-b282-03b6a20203e9 >> ${{ github.event.inputs.environment }}.json
          working-directory: .env

      - name: Copy env file to local.json to support serverless package command
        run: cp ${{ env.ZAMBDAS_LOCATION }}/.env/${{ github.event.inputs.environment }}.json ${{ env.ZAMBDAS_LOCATION }}/.env/local.json

      - name: Install dependencies
        run: pnpm install

      - name: Setup zapehr secrets
        run: cd ${{ env.ZAMBDAS_LOCATION }} && pnpm setup-zapehr-secrets ${{ github.event.inputs.environment }}

      - name: Deploy zambdas
        run: cd ${{ env.ZAMBDAS_LOCATION }} && pnpm deploy-zambdas ${{ github.event.inputs.environment }}
